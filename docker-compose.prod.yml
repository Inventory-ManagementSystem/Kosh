services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=1 --max-memory-per-child=300000
    mem_limit: 500m
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    mem_limit: 200m
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  ws:
  build: ./backend
  restart: unless-stopped
  command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
  mem_limit: 300m
  ports:
    - "127.0.0.1:8002:8000"
  env_file:
    - .env
  depends_on:
    redis:
      condition: service_started

volumes:
  redis_data:
