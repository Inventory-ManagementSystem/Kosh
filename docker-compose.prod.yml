
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      GUNICORN_CMD_ARGS: "--access-logfile - --error-logfile - --capture-output"
    depends_on:
      redis:
        condition: service_started
    logging: *default-logging

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=1 --max-memory-per-child=300000
    mem_limit: 500m
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    logging: *default-logging

  beat:
    build: ./backend
    restart: unless-stopped
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    mem_limit: 200m
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    logging: *default-logging

  ws:
    build: ./backend
    restart: unless-stopped
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    mem_limit: 300m
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    logging: *default-logging

volumes:
  redis_data:
