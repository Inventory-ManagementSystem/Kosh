services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

volumes:
  redis_data:
